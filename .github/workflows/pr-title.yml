name: "PR Title Checker"
on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Custom allowed types
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            Feature
            [Feature]
            Update
            [Update]
            Bug
            [Bug]
            Fix
            [Fix]
            Docs
            [Docs]
            Chore
            [Chore]
            Style
            [Style]
            Refactor
            [Refactor]
            Perf
            [Perf]
            Test
            [Test]
          # Optional: Require a specific scope
          requireScope: false
          # Optional: Ignore specific labels
          ignoreLabels: |
            bot
            ignore-semantic-pull-request
